[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weight-smithing"
version = "0.1.0"
description = "Direct, training-free neural weight programming in grid-based Breakout"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
minatar = ["minatar>=1.0.11"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
weightspace-eval = "weightspace.evaluate:main"
weightspace-inspect = "weightspace.inspect:main"
weightspace-patch = "weightspace.patch:main"
weightspace-plot = "weightspace.plot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

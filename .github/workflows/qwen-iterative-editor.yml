name: Iterative neuron editing pilots 013-015

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/qwen-iterative-editor.yml'
      - 'src/weightsmith/iterative_editor.py'
      - 'tests/test_weightsmith_iterative_editor.py'

permissions:
  contents: read

jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        pilot: ['013', '014', '015']
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[target,dev]'
      - name: Tests
        run: pytest -q
      - name: Run pilot
        run: python -m weightsmith.iterative_editor --pilot ${{ matrix.pilot }} --out artifacts/pilot-${{ matrix.pilot }}
      - name: Preserve raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iterative-editor-${{ matrix.pilot }}
          path: artifacts/pilot-${{ matrix.pilot }}/
          if-no-files-found: warn

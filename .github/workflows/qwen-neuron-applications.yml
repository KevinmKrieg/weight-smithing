name: Qwen neuron applications pilots 005-006

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/qwen-neuron-applications.yml'
      - 'src/weightsmith/neuron_applications.py'
      - 'tests/test_weightsmith_neuron_applications.py'

permissions:
  contents: read

jobs:
  applications:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU model dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[target,dev]'
      - name: Tests
        run: pytest -q
      - name: Run few-shot probes and synthetic auditing
        run: python -m weightsmith.neuron_applications --device cpu
      - name: Preserve full results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-neuron-applications-005-006
          path: artifacts/neuron-applications-005-006/
          if-no-files-found: warn

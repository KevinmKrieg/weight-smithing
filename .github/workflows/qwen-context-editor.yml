name: Context-conditioned weight editing pilots 019-021
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/qwen-context-editor.yml'
      - 'src/weightsmith/context_editor.py'
      - 'tests/test_weightsmith_context_editor.py'
permissions:
  contents: read
jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        pilot: ['019', '020', '021']
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[target,dev]'
      - name: Tests
        run: pytest -q
      - name: Run pilot
        run: python -m weightsmith.context_editor --pilot ${{ matrix.pilot }} --out artifacts/pilot-${{ matrix.pilot }}
      - name: Preserve raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-editor-${{ matrix.pilot }}
          path: artifacts/pilot-${{ matrix.pilot }}/
          if-no-files-found: warn

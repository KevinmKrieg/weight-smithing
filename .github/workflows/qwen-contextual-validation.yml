name: Contextual causal validation pilots 022-024
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/qwen-contextual-validation.yml'
      - 'src/weightsmith/contextual_validation.py'
      - 'tests/test_weightsmith_contextual_validation.py'
permissions:
  contents: read
jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        pilot: ['022', '023', '024']
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[target,dev]'
      - name: Tests
        run: pytest -q
      - name: Run pilot
        run: python -m weightsmith.contextual_validation --pilot ${{ matrix.pilot }} --out artifacts/pilot-${{ matrix.pilot }}
      - name: Preserve raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contextual-validation-${{ matrix.pilot }}
          path: artifacts/pilot-${{ matrix.pilot }}/
          if-no-files-found: warn

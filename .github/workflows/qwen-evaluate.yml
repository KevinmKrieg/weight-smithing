name: Qwen held-out weight-edit pilot (CPU)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/qwen-evaluate.yml'
      - 'experiments/proposals/qwen-001.json'

jobs:
  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference and chart dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[target,dev]'
      - name: Locked GPT-6 proposed patch versus identical controls
        run: |
          python -m weightsmith.experiment \
            --checkpoint Qwen/Qwen2.5-0.5B-Instruct \
            --revision 7ae557604adf67be50417f59c2c2f167def9a775 \
            --editor file \
            --proposal-file experiments/proposals/qwen-001.json \
            --device cpu --practice-per-family 2 \
            --heldout-per-family 8 --regression-per-family 3 \
            --max-new-tokens 32 \
            --out artifacts/qwen-pilot-001
          python -m weightsmith.plot \
            --run artifacts/qwen-pilot-001 \
            --out artifacts/qwen-pilot-001/charts
          cat artifacts/qwen-pilot-001/summary.json
          python - <<'PY'
          import json
          p='artifacts/qwen-pilot-001/heldout.json'
          data=json.load(open(p))['examples']
          print('HELDOUT CHANGED EXAMPLES:')
          for a,b in zip(data['base'],data['editor']):
              if a['correct'] != b['correct'] or a['response'] != b['response']:
                  print(json.dumps({'id':a['id'],'expected':a['expected'],
                      'before':a['response'][:150], 'before_ok':a['correct'],
                      'after':b['response'][:150], 'after_ok':b['correct']}))
          PY
      - name: Preserve complete raw results and generated charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-001-weight-edit-results
          path: artifacts/qwen-pilot-001/
          if-no-files-found: warn

name: Sparse constrained contextual pilots 025-027
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/qwen-sparse-contextual.yml'
      - 'src/weightsmith/sparse_contextual.py'
      - 'tests/test_weightsmith_sparse_contextual.py'
permissions:
  contents: read
jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        pilot: ['025', '026', '027']
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[target,dev]'
      - name: Tests
        run: pytest -q
      - name: Run pilot
        run: python -m weightsmith.sparse_contextual --pilot ${{ matrix.pilot }} --out artifacts/pilot-${{ matrix.pilot }}
      - name: Preserve raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sparse-contextual-${{ matrix.pilot }}
          path: artifacts/pilot-${{ matrix.pilot }}/
          if-no-files-found: warn

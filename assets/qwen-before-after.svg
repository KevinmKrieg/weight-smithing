<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 606" role="img" aria-label="Before: fenced JSON with Markdown code blocks. After: plain JSON that passes strict parsing, on all eight heldout JSON examples."><title>Qwen JSON formatting before and after weight edit</title><desc>Before: fenced JSON with Markdown code blocks. After: plain JSON that passes strict parsing, on all eight heldout JSON examples.</desc><defs><linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#218ea9"/><stop offset="1" stop-color="#63ebc8"/></linearGradient><linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10243a"/><stop offset="1" stop-color="#081421"/></linearGradient></defs><rect x="0" y="0" width="1200" height="606" rx="0" fill="url(#back)" stroke="none"/><text x="59" y="48" fill="#63ebc8" font-size="14" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-weight="760" text-anchor="start" letter-spacing="2">THE ACTUAL MODEL OUTPUT  /  HELD-OUT JSON</text><text x="55" y="107" fill="#f4f9ff" font-size="34" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-weight="790" text-anchor="start" letter-spacing="0">Same prompt. Same weights — except one row.</text><text x="58" y="143" fill="#9fb8ca" font-size="17" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-weight="500" text-anchor="start" letter-spacing="0">The requested response must be raw JSON, not Markdown.</text><rect x="47" y="174" width="530" height="361" rx="15" fill="#102438" stroke="#29465b"/><rect x="622" y="174" width="530" height="361" rx="15" fill="#102438" stroke="#29465b"/><text x="78" y="215" fill="#f19a92" font-size="15" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-weight="800" text-anchor="start" letter-spacing="0">BEFORE  /  INVALID</text><text x="653" y="215" fill="#63ebc8" font-size="15" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-weight="800" text-anchor="start" letter-spacing="0">AFTER  /  VALID</text><text x="79" y="273" fill="#f19a92" font-size="19" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-weight="560" text-anchor="start" letter-spacing="0">```json</text><text x="79" y="309" fill="#f4f9ff" font-size="19" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-weight="560" text-anchor="start" letter-spacing="0">{</text><text x="79" y="345" fill="#f4f9ff" font-size="19" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-weight="560" text-anchor="start" letter-spacing="0">  "ticket": 4900,</text><text x="79" y="381" fill="#f4f9ff" font-size="19" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-weight="560" text-anchor="start" letter-spacing="0">  "status": "pending"</text><text x="79" y="417" fill="#f4f9ff" font-size="19" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-weight="560" text-anchor="start" letter-spacing="0">}</text><text x="79" y="453" fill="#f19a92" font-size="19" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-weight="560" text-anchor="start" letter-spacing="0">```</text><text x="654" y="273" fill="#f4f9ff" font-size="19" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-weight="560" text-anchor="start" letter-spacing="0">{</text><text x="654" y="309" fill="#f4f9ff" font-size="19" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-weight="560" text-anchor="start" letter-spacing="0">  "ticket": 4900,</text><text x="654" y="345" fill="#f4f9ff" font-size="19" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-weight="560" text-anchor="start" letter-spacing="0">  "status": "pending"</text><text x="654" y="381" fill="#f4f9ff" font-size="19" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-weight="560" text-anchor="start" letter-spacing="0">}</text><rect x="77" y="478" width="210" height="31" rx="7" fill="#422b32" stroke="none"/><text x="94" y="499" fill="#f19a92" font-size="14" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-weight
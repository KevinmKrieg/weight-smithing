-anchor="start" letter-spacing="0">71.9%</text><text x="74" y="387" fill="#9fb8ca" font-size="15" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-weight="735" text-anchor="start" letter-spacing="0">RANDOM DIRECTION</text><rect x="300" y="357" width="257.8125" height="42" rx="8" fill="#91aafa" stroke="none"/><text x="573.8125" y="387" fill="#f4f9ff" font-size="20" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-weight="760" text-anchor="start" letter-spacing="0">46.9%</text><text x="74" y="457" fill="#9fb8ca" font-size="15" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-weight="735" text-anchor="start" letter-spacing="0">RANDOM TOKEN ROW</text><rect x="300" y="427" width="257.8125" height="42" rx="8" fill="#f1c77b" stroke="none"/><text x="573.8125" y="457" fill="#f4f9ff" font-size="20" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-weight="760" text-anchor="start" letter-spacing="0">46.9%</text><rect x="887" y="225" width="231" height="229" rx="13" fill="#152c42" stroke="#29465b"/><text x="910" y="255" fill="#9fb8ca" font-size="12" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-weight="770" text-anchor="start" letter-spacing="0">EDITED VS. ORIGINAL</text><text x="907" y="321" fill="#63ebc8" font-size="49" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-weight="840" text-anchor="start" letter-spacing="0">+25.0</text><text x="909" y="352" fill="#f4f9ff" font-size="16" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-weight="600" text-anchor="start" letter-spacing="0">percentage points</text><line x1="910" y1="375" x2="1091" y2="375" stroke="#29465b" stroke-width="1"/><text x="911" y="410" fill="#9fb8ca" font-size="14" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-weight="500" text-anchor="start" letter-spacing="0">95% paired CI</text><text x="911" y="436" fill="#f1c77b" font-size="19" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-weight="720" text-
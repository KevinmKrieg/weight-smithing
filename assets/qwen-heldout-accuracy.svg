<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 584" role="img" aria-label="On 32 novel heldout prompts, the GPT-6-designed output-weight edit improved accuracy by 25 percentage points. Both random controls remained at 46.9%."><title>Our Qwen accuracy experiment — 46.9% to 71.9%</title><desc>On 32 novel heldout prompts, the GPT-6-designed output-weight edit improved accuracy by 25 percentage points. Both random controls remained at 46.9%.</desc><defs><linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#218ea9"/><stop offset="1" stop-color="#63ebc8"/></linearGradient><linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10243a"/><stop offset="1" stop-color="#081421"/></linearGradient></defs><rect x="0" y="0" width="1200" height="584" rx="0" fill="url(#back)" stroke="none"/><text x="59" y="49" fill="#63ebc8" font-size="14" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-weight="760" text-anchor="start" letter-spacing="2">EXPERIMENT 01  /  MEASURED ON A REAL PRETRAINED LLM</text><text x="56" y="105" fill="#f4f9ff" font-size="36" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-weight="800" text-anchor="start" letter-spacing="0">896 weight values. +25 points accuracy.</text><text x="59" y="139" fill="#9fb8ca" font-size="16" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-weight="500" text-anchor="start" letter-spacing="0">Qwen2.5-0.5B-Instruct  ·  32 held-out prompts  ·  greedy decoding  ·  zero gradient updates</text><rect x="47" y="170" width="1105" height="347" rx="17" fill="#102438" stroke="#29465b"/><line x1="300" y1="199" x2="300" y2="476" stroke="#375267" stroke-width="1"/><text x="300" y="504" fill="#9fb8ca" font-size="13" font-family="Inter,system-ui,Segoe UI,Arial,sans-serif" font-weight="440" text-anchor="middle" letter-spacing="0">0%</text><line x1="410" y1="199" x2="410" y2="476" stroke="#375267" stroke-width="1"/><text x="410" y="504" fill="#9fb8ca" font-size="13" font-
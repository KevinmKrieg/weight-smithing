<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-label="Reward versus sticky action probability"><title>Reward versus sticky action probability</title><desc>Lead reward declines 14.666, 8.017, 4.242 and 2.25 as action persistence increases.</desc><defs><linearGradient id="gradient" x1="0" x2="1"><stop stop-color="#238FBB"/><stop offset="1" stop-color="#61E7C6"/></linearGradient></defs><rect x="0" y="0" width="1200" height="590" rx="0" fill="#0B1426" stroke="none"/><text x="64" y="53" text-anchor="start" fill="#61E7C6" font-size="14" font-family="Inter,Arial,sans-serif" font-weight="750">03  /  ROBUSTNESS</text><text x="64" y="107" text-anchor="start" fill="#F3F8FF" font-size="38" font-family="Inter,Arial,sans-serif" font-weight="800">The cost of unreliable actions</text><text x="64" y="139" text-anchor="start" fill="#9AB0C7" font-size="17" font-family="Inter,Arial,sans-serif" font-weight="450">Expected reward as the environment repeats actions with increasing probability</text><rect x="50" y="164" width="1100" height="395" rx="16" fill="#12223A" stroke="#283B54"/><line x1="135" y1="476" x2="813" y2="476" stroke="#314760" stroke-width="1" opacity="0.75"/><text x="115" y="480" text-anchor="end" fill="#9AB0C7" font-size="13" font-family="Inter,Arial,sans-serif" font-weight="500">0</text><line x1="135" y1="410.75" x2="813" y2="410.75" stroke="#314760" stroke-width="1" opacity="0.75"/><text x="115" y="414.75" text-anchor="end" fill="#9AB0C7" font-size="13" font-family="Inter,Arial,sans-serif" font-weight="500">4</text><line x1="135" y1="345.5" x2="813" y2="345.5" stroke="#314760" stroke-width="1" opacity="0.75"/><text x="115" y="349.5" text-anchor="end" fill="#9AB0C7" font-size="13" font-family="Inter,Arial,sans-serif" font-weight="500">8</text><line x1="135" y1="280.25" x2="813" y2="280.25" stroke="#314760" stroke-width="1" opacity="0.75"/><text x="115" y="284.25" text-anchor="end" fill="#9AB0C7" font-size="13" font-family="Inter,Arial,sans-serif" font-weight="500">12</text><line x1="135" y1="215" x2="813" y2="215" stroke="#314760" stroke-width="1" opacity="0.75"/><text x="115" y="219" text-anchor="end" fill="#9AB0C7" font-size="13" font-family="Inter,Arial,sans-serif" font-weight="500">16</text><line x1="135" y1="218" x2="135" y2="476" stroke="#314760" stroke-width="1" opacity="0.38"/><text x="135" y="504" text-anchor="middle" fill="#9AB0C7" font-size="14" font-family="Inter,Arial,sans-serif" font-weight="500">0%</text><line x1="270.6" y1="218" x2="270.6" y2="476" stroke="#314760" stroke-width="1" opacity="0.38"/><text x="270.6" y="504" text-anchor="middle" fill="#9AB0C7" font-size="14" font-family="Inter,Arial,sans-serif" font-weight="500">10%</text><line x1="474" y1="218" x2="474" y2="476" stroke="#314760" stroke-width="1" opacity="0.38"/><text x="474" y="504" text-anchor="middle" fill="#9AB0C7" font-size="14" font-family="Inter,Arial,sans-serif" font-weight="500">25%</text><line x1="813" y1="218" x2="813" y2="476" stroke="#314760" stroke-width="1" opacity="0.38"/><text x="813" y="504" text-anchor="middle" fill="#9AB0C7" font-size="14" font-family="Inter,Arial,sans-serif" font-weight="500">50%</text><polyline points="135,450.976625 270.6,450.2915 474,451.172375 813,451.107125" fill="none" stroke="#6C819A" stroke-width="2.5" stroke-linejoin="round"/><line x1="135" y1="451.7759375" x2="135" y2="450.161" stroke="#6C819A" stroke-width="2" opacity="0.8"/><circle cx="135" cy="450.976625" r="4" fill="#6C819A"/><line x1="270.6" y1="450.8624375" x2="270.6" y2="449.71240625" stroke="#6C819A" stroke-width="2" opacity="0.8"/><circle cx="270.6" cy="450.2915" r="4" fill="#6C819A"/><line x1="474" y1="451.9390625" x2="474" y2="450.389375" stroke="#6C819A" stroke-width="2" opacity="0.8"/><circle cx="474" cy="451.172375" r="4" fill="#6C819A"/><line x1="813" y1="451.890125" x2="813" y2="450.2751875" stroke="#6C819A" stroke-width="2" opacity="0.8"/><circle cx="813" cy="451.107125" r="4" fill="#6C819A"/><polyline point